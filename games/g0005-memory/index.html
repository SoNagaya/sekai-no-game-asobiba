<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>神経衰弱｜世界のゲームアソビバ</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <style>
      .board {
        display: grid;
        grid-template-columns: repeat(4, 80px);
        gap: 12px;
        justify-content: center;
        margin-top: 20px;
      }

      .card {
        width: 80px;
        height: 100px;
        border: none;
        border-radius: 12px;
        font-size: 32px;
        cursor: pointer;
        background: #2563eb;
        color: white;
      }

      .card.open,
      .card.matched {
        background: #eef2ff;
        color: #111;
      }

      .card.matched {
        cursor: default;
        opacity: 0.7;
      }

      .status {
        text-align: center;
        margin-top: 16px;
        font-size: 16px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="topbar">
        <a class="btn" href="../../index.html">← ゲーム一覧へ</a>
        <h1>神経衰弱</h1>
      </div>

      <div class="game-card">
        <p>同じマークのカードを2枚そろえよう。</p>

        <div class="board" id="board"></div>

        <div class="status" id="status">
          手数：0
        </div>

        <button id="reset">リセット</button>
      </div>
    </div>

    <script>
      const symbols = ["🍎", "🍌", "🍇", "🍒"];
      const boardEl = document.getElementById("board");
      const statusEl = document.getElementById("status");
      const resetBtn = document.getElementById("reset");

      let cards = [];
      let firstIndex = null;
      let secondIndex = null;
      let lockBoard = false;
      let moves = 0;

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }

      function setupGame() {
        const pairCards = [...symbols, ...symbols];
        shuffle(pairCards);

        cards = pairCards.map((symbol) => ({
          symbol,
          open: false,
          matched: false,
        }));

        firstIndex = null;
        secondIndex = null;
        lockBoard = false;
        moves = 0;

        render();
      }

      function render() {
        boardEl.innerHTML = "";

        cards.forEach((card, index) => {
          const button = document.createElement("button");
          button.className = "card";

          if (card.open) button.classList.add("open");
          if (card.matched) button.classList.add("matched");

          button.textContent = card.open || card.matched ? card.symbol : "?";

          button.addEventListener("click", () => handleCardClick(index));
          boardEl.appendChild(button);
        });

        const matchedCount = cards.filter((card) => card.matched).length / 2;

        if (matchedCount === symbols.length) {
          statusEl.textContent = `クリア！ 手数：${moves}`;
        } else {
          statusEl.textContent = `手数：${moves}`;
        }
      }

      function handleCardClick(index) {
        const card = cards[index];

        if (lockBoard || card.open || card.matched) return;

        card.open = true;

        if (firstIndex === null) {
          firstIndex = index;
          render();
          return;
        }

        secondIndex = index;
        moves++;
        lockBoard = true;
        render();

        const firstCard = cards[firstIndex];
        const secondCard = cards[secondIndex];

        if (firstCard.symbol === secondCard.symbol) {
          firstCard.matched = true;
          secondCard.matched = true;
          resetTurn();
          render();
          return;
        }

        setTimeout(() => {
          firstCard.open = false;
          secondCard.open = false;
          resetTurn();
          render();
        }, 800);
      }

      function resetTurn() {
        firstIndex = null;
        secondIndex = null;
        lockBoard = false;
      }

      resetBtn.addEventListener("click", setupGame);

      setupGame();
    </script>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>神経衰弱｜世界のゲームアソビバ</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <style>
      .memory-card {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .memory-head {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }

      .pill {
        padding: 10px 14px;
        border-radius: 999px;
        background: #eef2ff;
        font-size: 14px;
      }

      .memory-board {
        display: grid;
        grid-template-columns: repeat(4, minmax(68px, 92px));
        gap: 12px;
        justify-content: center;
      }

      .memory-button {
        width: 100%;
        aspect-ratio: 3 / 4;
        border: none;
        border-radius: 18px;
        cursor: pointer;
        position: relative;
        transform-style: preserve-3d;
        transition: box-shadow 0.2s ease;
        box-shadow: 0 10px 22px rgba(37, 99, 235, 0.16);
        background: transparent;
        padding: 0;
      }

      .memory-button:not(.is-open):not(.is-matched):hover {
        box-shadow: 0 14px 28px rgba(37, 99, 235, 0.22);
      }

      .memory-button:disabled {
        cursor: default;
      }

      .memory-face {
        position: absolute;
        inset: 0;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        backface-visibility: hidden;
        transition: transform 0.2s ease;
      }

      .memory-front {
        background: linear-gradient(160deg, #2563eb, #1d4ed8);
        color: #ffffff;
        font-size: 28px;
        font-weight: 700;
        transform: rotateY(0deg) translateY(0);
      }

      .memory-back {
        background: linear-gradient(180deg, #ffffff, #eef2ff);
        border: 2px solid #dbeafe;
        transform: rotateY(180deg) translateY(0);
        font-size: 52px;
        line-height: 1;
      }

      .memory-button:not(.is-open):not(.is-matched):hover .memory-front,
      .memory-button:not(.is-open):not(.is-matched):hover .memory-back,
      .memory-button.is-open .memory-front,
      .memory-button.is-open .memory-back,
      .memory-button.is-matched .memory-front,
      .memory-button.is-matched .memory-back {
        transform-origin: center;
      }

      .memory-button:not(.is-open):not(.is-matched):hover .memory-front {
        transform: rotateY(0deg) translateY(-2px);
      }

      .memory-button:not(.is-open):not(.is-matched):hover .memory-back {
        transform: rotateY(180deg) translateY(-2px);
      }

      .memory-button.is-open .memory-front,
      .memory-button.is-matched .memory-front {
        transform: rotateY(180deg) translateY(0);
      }

      .memory-button.is-open .memory-back,
      .memory-button.is-matched .memory-back {
        transform: rotateY(360deg) translateY(0);
      }

      .memory-button.is-open:hover .memory-front,
      .memory-button.is-matched:hover .memory-front {
        transform: rotateY(180deg) translateY(-2px);
      }

      .memory-button.is-open:hover .memory-back,
      .memory-button.is-matched:hover .memory-back {
        transform: rotateY(360deg) translateY(-2px);
      }

      .memory-button.is-matched .memory-back {
        background: linear-gradient(180deg, #dcfce7, #bbf7d0);
        border-color: #86efac;
      }

      .memory-note {
        margin: 0;
        text-align: center;
        color: #555;
        font-size: 14px;
      }

      @media (max-width: 520px) {
        .memory-board {
          grid-template-columns: repeat(3, minmax(72px, 92px));
        }

        .memory-back {
          font-size: 46px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <a class="btn" href="../../index.html">← ゲーム一覧へ</a>
        <h1>神経衰弱</h1>
      </div>

      <div class="game-card memory-card">
        <p>同じフルーツのカードを2枚そろえよう。</p>

        <div class="memory-head">
          <div class="pill" id="status">2枚めくってそろえるゲームです</div>
          <div class="pill" id="moves">手数：0</div>
          <div class="pill" id="pairs">そろえた枚数：0 / 6</div>
        </div>

        <div class="memory-board" id="board"></div>

        <p class="memory-note">そろわないカードは少し待つと裏返ります。</p>

        <div>
          <button id="reset">リセット</button>
        </div>
      </div>
    </div>

    <script>
      const symbols = ["🍎", "🍌", "🍇", "🍒", "🍉", "🍓"];
      const boardEl = document.getElementById("board");
      const statusEl = document.getElementById("status");
      const movesEl = document.getElementById("moves");
      const pairsEl = document.getElementById("pairs");
      const resetBtn = document.getElementById("reset");

      let cards = [];
      let firstIndex = null;
      let secondIndex = null;
      let lockBoard = false;
      let moves = 0;
      let matchedPairs = 0;

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }

      function setupGame() {
        const deck = [...symbols, ...symbols];
        shuffle(deck);

        cards = deck.map((symbol) => ({
          symbol,
          isOpen: false,
          isMatched: false,
        }));

        firstIndex = null;
        secondIndex = null;
        lockBoard = false;
        moves = 0;
        matchedPairs = 0;

        updateInfo("2枚めくってそろえるゲームです");
        render();
      }

      function updateInfo(message) {
        statusEl.textContent = message;
        movesEl.textContent = `手数：${moves}`;
        pairsEl.textContent = `そろえた枚数：${matchedPairs} / ${symbols.length}`;
      }

      function render() {
        boardEl.innerHTML = "";

        cards.forEach((card, index) => {
          const button = document.createElement("button");
          button.className = "memory-button";
          button.type = "button";

          if (card.isOpen) {
            button.classList.add("is-open");
          }

          if (card.isMatched) {
            button.classList.add("is-matched");
            button.disabled = true;
          }

          const front = document.createElement("span");
          front.className = "memory-face memory-front";
          front.textContent = "?";

          const back = document.createElement("span");
          back.className = "memory-face memory-back";
          back.textContent = card.symbol;

          button.appendChild(front);
          button.appendChild(back);
          button.addEventListener("click", () => handleCardClick(index));

          boardEl.appendChild(button);
        });
      }

      function handleCardClick(index) {
        const card = cards[index];

        if (lockBoard || card.isOpen || card.isMatched) {
          return;
        }

        card.isOpen = true;

        if (firstIndex === null) {
          firstIndex = index;
          updateInfo("1枚目をめくりました");
          render();
          return;
        }

        secondIndex = index;
        moves++;
        lockBoard = true;

        const firstCard = cards[firstIndex];
        const secondCard = cards[secondIndex];

        if (firstCard.symbol === secondCard.symbol) {
          firstCard.isMatched = true;
          secondCard.isMatched = true;
          matchedPairs++;
          resetTurn();

          if (matchedPairs === symbols.length) {
            updateInfo(`クリア！ ${moves}手で全ペアそろえました`);
          } else {
            updateInfo("そろいました！");
          }

          render();
          return;
        }

        updateInfo("ちがうカードです");
        render();

        setTimeout(() => {
          firstCard.isOpen = false;
          secondCard.isOpen = false;
          resetTurn();
          updateInfo("もう一度ためしてみよう");
          render();
        }, 850);
      }

      function resetTurn() {
        firstIndex = null;
        secondIndex = null;
        lockBoard = false;
      }

      resetBtn.addEventListener("click", setupGame);

      setupGame();
    </script>
  </body>
</html>

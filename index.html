<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>世界のゲームアソビバ｜無料ミニゲーム集</title>
    <link rel="stylesheet" href="./assets/css/style.css">
  </head>
  <body>
    <div class="container">
      <h1>世界のゲームアソビバ</h1>
      <p class="sub">無料で遊べるミニゲーム集｜随時追加中（5/100）</p>
      <div class="grid">
        <div class="card">
          <div class="badge">G001</div>
          <div class="row">
            <div class="icon">
              <img src="./icons/g001.png" alt="クリックカウンターのアイコン">
            </div>
            <div class="meta">
              <h2>クリックカウンター</h2>
              <p>ボタンを押すだけの最初のミニゲーム。</p>
            </div>
          </div>
          <div class="actions">
            <a class="btn primary" href="./games/g001-click-counter/index.html">遊ぶ</a>
          </div>
        </div>
        <div class="card">
          <div class="badge">G002</div>
          <div class="row">
            <div class="icon">
              <img src="./icons/g002.png" alt="○×ゲームのアイコン">
            </div>
            <div class="meta">
              <h2>○×ゲーム</h2>
              <p>CPUと対戦する定番のボードゲーム。</p>
            </div>
          </div>
          <div class="actions">
            <a class="btn primary" href="./games/g002-tic-tac-toe/">遊ぶ</a>
          </div>
        </div>
        <div class="card">
          <div class="badge">G003</div>
          <div class="row">
            <div class="icon">
              <img src="./icons/g003.png" alt="反射神経ゲームのアイコン">
            </div>
            <div class="meta">
              <h2>反射神経ゲーム</h2>
              <p>10秒で何回ターゲットを押せるか挑戦します。</p>
            </div>
          </div>
          <div class="actions">
            <a class="btn primary" href="./games/g003-reaction/">遊ぶ</a>
          </div>
        </div>
        <div class="card">
          <div class="badge">G004</div>
          <div class="row">
            <div class="icon">
              <img src="./icons/g004.png" alt="数当てゲームのアイコン">
            </div>
            <div class="meta">
              <h2>数当てゲーム</h2>
              <p>1から100までの数字をヒントで絞って当てます。</p>
            </div>
          </div>
          <div class="actions">
            <a class="btn primary" href="./games/g004-number-guess/">遊ぶ</a>
          </div>
        </div>
        <div class="card">
          <div class="badge">G005</div>
          <div class="row">
            <div class="icon">
              <img src="./icons/g005.png" alt="神経衰弱のアイコン">
            </div>
            <div class="meta">
              <h2>神経衰弱</h2>
              <p>フルーツのカードを2枚ずつそろえる記憶ゲーム。</p>
            </div>
          </div>
          <div class="actions">
            <a class="btn primary" href="./games/g005-memory/">遊ぶ</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
